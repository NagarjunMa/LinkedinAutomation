# Lefthook configuration — runs both application CI suites before every push
# Bypass with: git push --no-verify

pre-push:
  parallel: false
  commands:
    backend-ci:
      run: make verify-backend-ci
      fail_text: "Backend CI checks failed — fix them before pushing"

    frontend-ci:
      run: make verify-frontend-ci
      fail_text: "Frontend CI checks failed — fix them before pushing"
