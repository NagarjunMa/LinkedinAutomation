services:
  - type: web
    name: linkedin-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkedin-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: linkedin-redis
          property: connectionString

  - type: web
    name: linkedin-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: linkedin-backend
          property: host

  - type: redis
    name: linkedin-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: linkedin-db
    databaseName: linkedin_automation
    user: linkedin_user
    region: oregon
    plan: starter