name: Release Railway backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: Configured GitHub release environment
        type: choice
        options:
          - development
          - production
        required: true

permissions:
  contents: read

concurrency:
  group: railway-backend-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install --global @railway/cli@5.71.0
      - name: Run Alembic and release web
        env:
          RELEASE_WEB_TOKEN: ${{ secrets.RAILWAY_WEB_TOKEN }}
          RELEASE_MIGRATION_TOKEN: ${{ secrets.RAILWAY_MIGRATION_TOKEN }}
          RELEASE_PROJECT: ${{ vars.RAILWAY_PROJECT_ID }}
          RELEASE_WEB_ENVIRONMENT: ${{ vars.RAILWAY_WEB_ENVIRONMENT_ID }}
          RELEASE_MIGRATION_ENVIRONMENT: ${{ vars.RAILWAY_MIGRATION_ENVIRONMENT_ID }}
          RELEASE_MIGRATOR: ${{ vars.RAILWAY_MIGRATION_SERVICE_ID }}
          RELEASE_WEB: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
        shell: bash
        run: |
          : "${RELEASE_WEB_TOKEN:?Set the environment-scoped web project token}"
          extra=()
          if [[ -n "$RELEASE_MIGRATION_ENVIRONMENT" ]]; then
            extra+=(--migration-environment "$RELEASE_MIGRATION_ENVIRONMENT")
          fi
          python3 backend/scripts/railway_backend_release.py \
            --project "$RELEASE_PROJECT" --environment "$RELEASE_WEB_ENVIRONMENT" \
            --migrator "$RELEASE_MIGRATOR" --web "$RELEASE_WEB" \
            --revision "$GITHUB_SHA" "${extra[@]}"
