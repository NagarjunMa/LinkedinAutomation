name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: |
          pip install ruff==0.5.0
          ruff check app/ --select=E,F --ignore=E501,E402

      - name: Migration smoke (Postgres clean DB)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: python -m alembic upgrade head

      - name: Run tests (SQLite default — fast)
        env:
          OPENAI_API_KEY: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ --ignore=tests/golden -v --maxfail=5 \
            --cov-fail-under=80

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Run tests (Postgres — concurrency-sensitive paths)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: |
          python -m pytest tests/services/credits/ -v -k "concurrent"

      - name: Dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.lock

      - name: Docker build
        working-directory: .
        run: docker build -t prism-backend-ci ./backend

  frontend:
    name: Frontend (lint + build + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run build

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run MVP Playwright smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run test:e2e

      - name: Run public-preview landing smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npx playwright test tests/e2e/landing-page.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Docker build
        working-directory: .
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -t prism-frontend-ci ./frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/cobertura-coverage.xml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog verified scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
