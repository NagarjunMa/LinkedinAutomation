name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: |
          pip install ruff==0.5.0
          ruff check app/ --select=E,F --ignore=E501,E402

      - name: Migration smoke (Postgres clean DB)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: sh scripts/migrate.sh

      - name: Migration smoke (Postgres existing schema)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_existing_smoke"
          SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/prism_existing_smoke"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql://postgres:postgres@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE prism_existing_smoke"))
          PY
          python -m alembic upgrade 2026_09_06_waitlist
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql://postgres:postgres@localhost:5432/prism_existing_smoke")
          with engine.begin() as connection:
              connection.execute(text("""INSERT INTO waitlist_entries
                  (id, normalized_email, consent_granted, consent_version,
                   consented_at, source, retention_expires_at)
                  VALUES ('ci-existing-schema', 'ci@example.invalid', true, 'test',
                          now(), 'test', now() + interval '30 days')"""))
          PY
          sh scripts/migrate.sh
          python -m alembic current --check-heads
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql://postgres:postgres@localhost:5432/prism_existing_smoke")
          with engine.connect() as connection:
              assert connection.execute(text("SELECT count(*) FROM waitlist_entries WHERE id = 'ci-existing-schema'")).scalar_one() == 1
          PY

      - name: Run tests (SQLite default — fast)
        env:
          OPENAI_API_KEY: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ --ignore=tests/golden -v --maxfail=5 \
            --cov-fail-under=80

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Run tests (Postgres — concurrency-sensitive paths)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: |
          python -m pytest tests/services/credits/ -v -k "concurrent"

      - name: Dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.lock

      - name: Docker build
        working-directory: .
        run: |
          docker build -t prism-backend-ci ./backend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -t prism-combined-ci .

      - name: Backend image runtime smoke
        working-directory: .
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              for database in ("prism_backend_smoke", "prism_combined_smoke"):
                  connection.execute(text(f"CREATE DATABASE {database}"))
          PY

          for pair in "prism-backend-ci prism_backend_smoke" "prism-combined-ci prism_combined_smoke"; do
            read -r image database <<< "$pair"
            docker run --rm \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI=sqlite:///:memory: \
              "$image" python -m scripts.smoke_container

            if timeout 20s docker run --rm --network host \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI="postgresql://postgres:postgres@localhost:5432/$database" \
              "$image"; then
              echo "Web started before release migration" >&2
              exit 1
            else
              start_status=$?
              if [ "$start_status" -eq 124 ]; then
                echo "Web did not reject an unmigrated schema" >&2
                exit 1
              fi
            fi
            python - "$database" <<'PY'
          import sys
          from sqlalchemy import create_engine, text
          engine = create_engine(f"postgresql://postgres:postgres@localhost:5432/{sys.argv[1]}")
          with engine.connect() as connection:
              assert connection.execute(text("SELECT to_regclass('public.alembic_version')")).scalar_one() is None
          PY
            docker run --rm --network host \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI="postgresql://postgres:postgres@localhost:5432/$database" \
              "$image" sh scripts/migrate.sh

            container_id=$(docker run -d --network host \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI="postgresql://postgres:postgres@localhost:5432/$database" \
              "$image")
            trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
            healthy=false
            for attempt in $(seq 1 60); do
              if curl -fsS -A PrismPro-Container-Health/1.0 http://127.0.0.1:8000/health > /tmp/prism-health.json 2>/dev/null && \
                  python -c 'import json; assert json.load(open("/tmp/prism-health.json"))["status"] == "healthy"'; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            for attempt in $(seq 1 40); do
              probe_status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
              if [ "$probe_status" = healthy ]; then
                break
              fi
              sleep 1
            done
            if [ "$probe_status" != healthy ]; then
              docker logs "$container_id"
              exit 1
            fi
            python - "$database" <<'PY'
          import sys
          from sqlalchemy import create_engine, text
          engine = create_engine(f"postgresql://postgres:postgres@localhost:5432/{sys.argv[1]}")
          with engine.connect() as connection:
              assert connection.execute(text("SELECT count(*) FROM alembic_version")).scalar_one() >= 1
          PY
            docker rm -f "$container_id" >/dev/null
            trap - EXIT
          done

  frontend:
    name: Frontend (lint + build + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python for offline API contracts
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install contract export dependencies
        run: python -m pip install -r ../backend/requirements.lock ruff==0.5.0

      - name: Verify API contract tooling and drift
        run: make -C .. verify-contracts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run build

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run MVP Playwright smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run test:e2e

      - name: Run public-preview landing smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npx playwright test tests/e2e/landing-page.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Complete dependency audit
        run: npm audit --include=dev --audit-level=high

      - name: Docker build
        working-directory: .
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -t prism-frontend-ci ./frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/cobertura-coverage.xml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: TruffleHog verified scan
        # TruffleHog v3.97.9. The action wrapper cannot express an omitted
        # --since-commit, so run the reviewed image directly for full history.
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db \
            git file:///repo/ \
            --branch "$GITHUB_SHA" \
            --fail --fail-on-scan-errors --no-update --github-actions --only-verified
