name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: |
          pip install ruff==0.5.0
          ruff check app/ --select=E,F --ignore=E501,E402

      - name: Migration smoke (Postgres clean DB)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: python -m alembic upgrade head

      - name: Run tests (SQLite default — fast)
        env:
          OPENAI_API_KEY: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ --ignore=tests/golden -v --maxfail=5 \
            --cov-fail-under=80

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Run tests (Postgres — concurrency-sensitive paths)
        env:
          OPENAI_API_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism_test"
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: |
          python -m pytest tests/services/credits/ -v -k "concurrent"

      - name: Dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.lock

      - name: Docker build
        working-directory: .
        run: |
          docker build -t prism-backend-ci ./backend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -t prism-combined-ci .

      - name: Backend image runtime smoke
        working-directory: .
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              for database in ("prism_backend_smoke", "prism_combined_smoke"):
                  connection.execute(text(f"CREATE DATABASE {database}"))
          PY

          for pair in "prism-backend-ci prism_backend_smoke" "prism-combined-ci prism_combined_smoke"; do
            read -r image database <<< "$pair"
            docker run --rm \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI=sqlite:///:memory: \
              "$image" python -m scripts.smoke_container

            container_id=$(docker run -d --network host \
              -e OPENAI_API_KEY=test \
              -e SUPABASE_URL=https://test.supabase.co \
              -e SUPABASE_ANON_KEY=test \
              -e SUPABASE_SERVICE_ROLE_KEY=test \
              -e SQLALCHEMY_DATABASE_URI="postgresql://postgres:postgres@localhost:5432/$database" \
              "$image")
            trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
            healthy=false
            for attempt in $(seq 1 60); do
              if curl -fsS -A PrismPro-Container-Health/1.0 http://127.0.0.1:8000/health > /tmp/prism-health.json 2>/dev/null && \
                  python -c 'import json; assert json.load(open("/tmp/prism-health.json"))["status"] == "healthy"'; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            for attempt in $(seq 1 40); do
              probe_status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
              if [ "$probe_status" = healthy ]; then
                break
              fi
              sleep 1
            done
            if [ "$probe_status" != healthy ]; then
              docker logs "$container_id"
              exit 1
            fi
            python - "$database" <<'PY'
          import sys
          from sqlalchemy import create_engine, text
          engine = create_engine(f"postgresql://postgres:postgres@localhost:5432/{sys.argv[1]}")
          with engine.connect() as connection:
              assert connection.execute(text("SELECT count(*) FROM alembic_version")).scalar_one() >= 1
          PY
            docker rm -f "$container_id" >/dev/null
            trap - EXIT
          done

  frontend:
    name: Frontend (lint + build + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python for offline API contracts
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install contract export dependencies
        run: python -m pip install -r ../backend/requirements.lock ruff==0.5.0

      - name: Verify API contract tooling and drift
        run: make -C .. verify-contracts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run build

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run MVP Playwright smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run test:e2e

      - name: Run public-preview landing smoke
        env:
          PRISM_PRO_PUBLIC_PREVIEW_ONLY: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npx playwright test tests/e2e/landing-page.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Docker build
        working-directory: .
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -t prism-frontend-ci ./frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/cobertura-coverage.xml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog verified scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
